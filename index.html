<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VisualMath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..700,100,1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }, svg: { fontCache: 'global' } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <aside class="panel">
    <header class="brand">
      <h1>VisualMath</h1>
      <p>Surfaces, knots and chaotic attractors in 3D.</p>
    </header>

    <div class="picker">
      <select id="function-select" aria-label="Choose a model"></select>
      <button id="prev" aria-label="Previous model">‹</button>
      <button id="next" aria-label="Next model">›</button>
      <button id="random" aria-label="Random model">⟳</button>
    </div>

    <section class="info" id="info">
      <span id="func-badge" class="badge"></span>
      <h2 id="func-name">Loading…</h2>
      <div class="eq"><div id="func-eq"></div></div>
      <p id="func-desc"></p>
    </section>

    <footer class="hint">Drag to rotate · Scroll to zoom · Use ← → to browse</footer>
  </aside>

  <main class="stage">
    <div id="loader" class="loader"><i></i><span>Computing</span></div>
    <div id="plot"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
